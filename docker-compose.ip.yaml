# IP-based deployment of the API + the single nginx entrypoint.
# Publishes:
#   :4448 -> API
#   :4447 -> UI (proxied to the `ui` container on the shared `miseenscreen` network)
#
# Usage:
#   docker network create miseenscreen   # once, if it does not exist yet
#   docker compose -f docker-compose.ip.yaml up -d --build
services:
  db:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./.mysql/data:/var/lib/mysql
    networks:
      - api-miseenscreen
  php-fpm:
    build: .
    restart: always
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/app
      # Allow the IP/port frontend origin. origin_regex is enabled in nelmio,
      # so this matches any http(s) origin (any host/port) — fine for an
      # internal IP deployment. Tighten to e.g. ^http://1\.2\.3\.4:5554$ if needed.
      - CORS_ALLOW_ORIGIN=^https?://.*$
    volumes:
      - ./.symfony/jwt:/var/www/html/config/jwt
      - ./.storage:/var/www/html/.storage
    networks:
      - api-miseenscreen
  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx-ip.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    ports:
      - 4448:4448
      - 4447:4447
    networks:
      - api-miseenscreen

networks:
  api-miseenscreen:
    name: miseenscreen
    external: true
